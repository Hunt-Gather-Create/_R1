# The PR test gate (_R1#107).
#
# ONE job, ONE command. That is the whole design and it is deliberate.
#
# Before this existed, the only check-run on a PR was `Vercel Preview
# Comments`, which reports FAILURE on every cross-fork PR for authorization
# reasons unrelated to the code. So a red suite, a green suite, and a suite
# that never ran all rendered as the same red mark. That is worse than no
# check at all: a missing gate makes you go look, an uninformative one tells
# you not to bother.
#
# The value here is not that the tests run. It is that the PR page finally
# shows three different pictures for three different states.
#
# THIS REPORTS. IT DOES NOT BLOCK. The runway branch is unprotected and this
# check is not a required status check, so a red PR can still be merged with
# one click. Making it enforcing means marking `vitest` required via branch
# protection or a ruleset, which constrains the operator's own merge button
# and is therefore his decision, not this file's. See docs/runway/test-gates.md.
#
# DO NOT GROW THIS FILE. No matrix, no OS spread, no node-version spread, no
# build, no lint. The fleet burned 3,000 Actions minutes in one day on
# over-engineered pipelines; this shape is the one that does not become that.
# Anything beyond one job and one command per job is a new decision, not an edit.
#
# Specifically excluded, with reasons:
#   - `pnpm build`, its first step connects to a live Turso database. It is
#     safe only behind SKIP_DB_MIGRATIONS=1, which makes it a compile check
#     rather than a build check. That belongs in a deliberate step, not an
#     automatic one.
#   - lint, warnings only today, would add noise without adding signal.
#
# `pull_request`, NOT `pull_request_target`: our PRs come from a fork, and
# pull_request_target would run fork code with access to repository secrets.
# This job needs no secrets, since the suite never touches a live database.
name: PR tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:run

  # _R1#125. proxy.reachability.test.ts drives the real proxy export with
  # real NextRequest objects, no authkit-nextjs mock, and proves the four
  # chat routes actually redirect an unauthenticated request. It runs
  # under its own vitest config (vitest.reachability.config.mts) via
  # `pnpm test:reachability`, a separate command from the `test` job's
  # `pnpm test:run` above, one job, one command, same shape, per this
  # file's own standing note. A second command folded into the `test`
  # job would violate that note; a second job with one command does not.
  # No secrets needed: the suite sets its own dummy WORKOS_* env vars at
  # module load and never makes a live WorkOS call.
  reachability:
    name: reachability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:reachability

  # _R1#147. tsc --noEmit now reports zero errors on runway, confirmed
  # 2026-09-28, so the earlier exclusion above no longer holds. This job
  # runs it alone, same shape as the other two jobs, one job, one command.
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: npx tsc --noEmit -p tsconfig.json
