# Cross-PR stale notice on runway push, _R1#121, rewritten for _R1#190.
#
# _R1#120 is the reason this exists. #108 and #112 each landed green
# alone. Nothing re-ran the guard suite against the two of them combined
# before both were on runway, and combined they fail. See
# scripts/cross-pr-recheck/RECONSTRUCTION-120-PAIR.md for the
# reproduction: green, green, red, reconstructed from the actual patches.
#
# _R1#190 IS WHY THE SHAPE BELOW IS NOT WHAT #121 ORIGINALLY SHIPPED.
# The original version called the GitHub Actions rerun API against each
# PR's existing pr-tests.yml run. A rerun reuses the original run's
# github.sha, the merge commit GitHub computed once when that run first
# queued, frozen for the life of that run. So the rerun always rebuilt
# the OLD merge commit and never tested the new runway tip, while still
# reporting green on the PR's checks as if it had. Confirmed against
# GitHub's own docs on re running workflows and jobs, and reproduced
# live on PRs 200 to 202, scripts/cross-pr-recheck/RECONSTRUCTION-120-PAIR.md's
# sibling ticket. Making the rerun actually test the new tip would need
# a workflow_dispatch trigger on pr-tests.yml, explicit ref branching in
# its checkout step, and a Checks API round trip to attach the result to
# the PR, since a workflow_dispatch run is not attached to a PR's checks
# the way a pull_request run is. pr-tests.yml's own header says not to
# grow that file past one job, one command; the operator's 2026-09-29
# ruling also keeps this repo's checks report only, not a build worth
# making heavier to re run automatically. So this file no longer tries
# to retest anything. It tells a PR's author their checks might be
# stale instead, which is the honest version of what it can actually
# do without either of those costs.
#
# WHAT THIS DOES, IN ONE SENTENCE. On every push to runway, for every
# open PR targeting runway whose branch is not already caught up to the
# new tip, this posts or edits a single comment naming the new tip and
# telling the author to push or rebase to get a current check.
#
# THE FILE IS STILL NAMED cross-pr-recheck.yml. Renaming it would break
# the run history link GitHub keeps per file path, and other files
# reference it by this exact path: ROADMAP.md and
# scripts/cross-pr-recheck/RECONSTRUCTION-120-PAIR.md. The name: field
# below is corrected instead, since that is the part a person actually
# reads on the Actions tab and the PR timeline.
#
# REUSE, NOT REIMPLEMENT. The staleness check below is the same
# merge-base --is-ancestor ancestry question post-merge-smoke.yml already
# asks about a different pair of commits, same reasoning: containment,
# is the new tip reachable from this PR's head, not equality.
#
# THE MARKER. Each comment starts with an HTML comment, invisible when
# rendered, `<!-- cross-pr-recheck -->`. The real logic lives in
# scripts/cross-pr-recheck/recheck.sh, which lists a PR's existing
# comments, finds one starting with the marker, and PATCHes it instead
# of POSTing a new one. A busy runway day must not bury a PR in
# duplicate comments saying the same thing.
#
# THE BOUND. At most CROSS_PR_RECHECK_BOUND open PRs get checked per
# push. Past the bound, the dropped PR numbers are printed explicitly,
# never silently. Carried over unchanged from the original version.
#
# RED VERSUS A QUIET SKIP, THE LESSON _R1#97 ALREADY PAID FOR. A run
# that found zero open PRs and a run that could not list PRs at all must
# not render the same. A failure to list open PRs, to check a PR's
# ancestry, or to post or edit its comment fails this job outright. A
# genuine zero open PRs, or a genuine zero stale PRs among the ones
# found, is printed as exactly that and the job succeeds.
#
# THE WITNESSABLE ARTIFACT. A stale-notice comment appearing on an open
# PR, dated after an unrelated merge to runway, that nobody posted by
# hand, with the marker line present so a second push edits it in place
# instead of piling on. That is witnessable only after a real merge with
# a real open PR present, which this file cannot manufacture for itself
# at review time. scripts/cross-pr-recheck/recheck.sh accepts DRY_RUN=1
# to print what it would post or edit without touching anything, runnable
# by a person from their own machine against the live repo, read only,
# for exactly this reason.
#
# PERMISSIONS, LEAST NEEDED. pull-requests: write, to read and post or
# edit PR comments; contents: read, to fetch each PR's head commit and
# check ancestry locally rather than over the API. actions: write is
# gone, the old rerun API call is gone with it. pull-requests: read is
# gone too, since write already implies read on this token's permission
# model.
#
# HAZARD. No deployed host is touched. No pnpm build runs here, no
# database is touched. GITHUB_TOKEN's value is never printed, echoed, or
# logged, only its presence is relied on implicitly by gh, the same
# shape as the secret presence check in post-merge-smoke.yml.
name: Cross-PR stale-notice comment on runway push

on:
  push:
    branches:
      - runway

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: cross-pr-recheck-runway
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}
  CROSS_PR_RECHECK_BOUND: 15
  NEW_TIP: ${{ github.sha }}

jobs:
  recheck:
    name: comment on every open PR targeting runway whose branch is stale, bounded
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: post or edit a stale-notice comment on every open PR targeting runway, bounded
        run: bash scripts/cross-pr-recheck/recheck.sh
